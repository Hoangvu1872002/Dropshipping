<!-- =========================================================
     VIDEO 4: RASCAL ROVER INSTALL (16:9 VIDEO CARD)
     Hoạt động CHUẨN XÁC như 1 item trong array (arrVideo):
     - Hiện poster sắc nét với nút Play tròn màu cam ở giữa
     - Bấm vào phát CÓ ÂM THANH ngay lập tức, nút Play ẩn đi
     - Bấm lại thì Tạm dừng và nút Play hiện lại
     - Nút Mute góc dưới cho phép Bật/Tắt tiếng
     - Tự động dừng khi cuộn ra ngoài màn hình
     - Kích thước: 16:9 Widescreen (thay vì 9:16 dạng dọc của array)
========================================================= -->

<div class="dog-video-single-card" id="rascalRoverInstallCard">
    <!-- VIDEO -->
    <video playsinline muted loop preload="none"
        poster="https://res.cloudinary.com/x9bj9p2l/video/upload/f_auto,q_auto,so_5/v1789206441/RascalRoverInsstall.jpg">
        <source src="https://res.cloudinary.com/x9bj9p2l/video/upload/vc_h264,q_auto/v1789206441/RascalRoverInsstall.mp4"
            type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <!-- NÚT PLAY TRÒN MÀU CAM Ở GIỮA CARD -->
    <button class="dog-video-play" type="button" aria-label="Play video"></button>

    <!-- NÚT MUTE / UNMUTE GÓC DƯỚI PHẢI (CHUẨN 100% THEO ITEM ARRVIDEO) -->
    <button class="dog-video-mute" type="button" aria-label="Unmute video">
        <svg viewBox="0 0 24 24">
            <path d="M5 9V15H9L14 19V5L9 9H5Z"></path>
            <line x1="17" y1="9" x2="21" y2="15"></line>
            <line x1="21" y1="9" x2="17" y2="15"></line>
        </svg>
    </button>
</div>

<style>
    /* =========================================================
       CSS CHO VIDEO CARD (CHUẨN THEO ITEM ARRAY - TỈ LỆ 16:9)
    ========================================================= */
    .dog-video-single-card {
        position: relative !important;
        width: 100% !important;
        max-width: 1000px !important;
        margin: 0 auto !important;
        aspect-ratio: 16 / 9 !important;
        border-radius: 16px !important;
        overflow: hidden !important;
        background: #000000 !important;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12) !important;
        cursor: pointer !important;
        user-select: none !important;
        -webkit-user-select: none !important;
        -webkit-tap-highlight-color: transparent !important;
        box-sizing: border-box !important;
        transform: translateZ(0) !important;
        backface-visibility: hidden !important;
    }

    .dog-video-single-card * {
        box-sizing: border-box !important;
        -webkit-tap-highlight-color: transparent !important;
    }

    .dog-video-single-card:hover {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12) !important;
    }

    /* VIDEO ELEMENT */
    .dog-video-single-card video {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        object-position: center !important;
        border-radius: 16px !important;
        background: #000000 !important;
        display: block !important;
        pointer-events: none !important;
        -webkit-tap-highlight-color: transparent !important;
        transform: translateZ(0) !important;
        backface-visibility: hidden !important;
    }

    /* =========================================================
       NÚT PLAY TRÒN MÀU CAM Ở GIỮA (CHUẨN 100% ITEM ARRAY)
       - Luôn hiện ở giữa khi pause
       - Bấm vào Play thì ẩn đi
    ========================================================= */
    .dog-video-single-card .dog-video-play {
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        width: 64px !important;
        height: 64px !important;
        min-width: 64px !important;
        min-height: 64px !important;
        max-width: 64px !important;
        max-height: 64px !important;
        aspect-ratio: 1 / 1 !important;
        border-radius: 50% !important;
        background: #f58220 !important;
        border: none !important;
        cursor: pointer !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        z-index: 3 !important;
        transition: transform 0.2s ease, background-color 0.2s ease, opacity 0.25s ease, visibility 0.25s ease !important;
        box-shadow: 0 4px 16px rgba(245, 130, 32, 0.45) !important;
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
        padding: 0 !important;
        margin: 0 !important;
        box-sizing: border-box !important;
        line-height: 1 !important;
        outline: none !important;
        flex-shrink: 0 !important;
        -webkit-appearance: none !important;
        appearance: none !important;
    }

    /* Tam giác Play màu trắng bên trong nút cam */
    .dog-video-single-card .dog-video-play::after {
        content: '' !important;
        display: block !important;
        width: 0 !important;
        height: 0 !important;
        border-top: 12px solid transparent !important;
        border-bottom: 12px solid transparent !important;
        border-left: 20px solid #ffffff !important;
        margin-left: 5px !important;
        box-sizing: border-box !important;
    }

    /* Hover nút Play */
    @media (hover: hover) {
        .dog-video-single-card:not(.is-playing):not(.is-buffering) .dog-video-play:hover {
            transform: translate(-50%, -50%) scale(1.1) !important;
            background: #e07016 !important;
        }
    }

    /* Khi đang phát -> Ẩn nút Play */
    .dog-video-single-card.is-playing .dog-video-play {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
    }

    /* Buffering Spinner */
    .dog-video-single-card.is-buffering .dog-video-play {
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: none !important;
        background: rgba(0, 0, 0, 0.75) !important;
        border: 3px solid rgba(255, 255, 255, 0.3) !important;
        border-top-color: #F58220 !important;
        animation: dogSingleSpin 0.75s linear infinite !important;
    }

    .dog-video-single-card.is-buffering .dog-video-play::after {
        display: none !important;
    }

    @keyframes dogSingleSpin {
        0% {
            transform: translate(-50%, -50%) rotate(0deg);
        }

        100% {
            transform: translate(-50%, -50%) rotate(360deg);
        }
    }

    /* =========================================================
       NÚT MUTE / UNMUTE (CHUẨN 100% ITEM ARRAY ARRVIDEO)
       - Nút tròn mờ góc dưới phải: 36px x 36px, cách góc 12px
       - Hiện khi rê chuột (hover) trên desktop, luôn hiện trên mobile
    ========================================================= */
    .dog-video-single-card .dog-video-mute {
        position: absolute !important;
        bottom: 12px !important;
        right: 12px !important;
        width: 36px !important;
        height: 36px !important;
        min-width: 36px !important;
        min-height: 36px !important;
        max-width: 36px !important;
        max-height: 36px !important;
        aspect-ratio: 1 / 1 !important;
        border-radius: 50% !important;
        background: rgba(0, 0, 0, 0.6) !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
        cursor: pointer !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        opacity: 0 !important;
        visibility: hidden !important;
        transition: opacity 0.25s ease, background-color 0.25s ease, transform 0.2s ease !important;
        z-index: 2 !important;
        padding: 0 !important;
        margin: 0 !important;
        box-sizing: border-box !important;
        line-height: 1 !important;
        outline: none !important;
        box-shadow: none !important;
        flex-shrink: 0 !important;
        -webkit-appearance: none !important;
        appearance: none !important;
    }

    .dog-video-single-card:hover .dog-video-mute {
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
    }

    .dog-video-single-card .dog-video-mute:hover {
        background: rgba(245, 130, 32, 0.9) !important;
        border-color: #f58220 !important;
        transform: scale(1.08) !important;
    }

    .dog-video-single-card .dog-video-mute svg {
        display: block !important;
        width: 18px !important;
        height: 18px !important;
        min-width: 18px !important;
        min-height: 18px !important;
        max-width: 18px !important;
        max-height: 18px !important;
        stroke: #ffffff !important;
        stroke-width: 2 !important;
        stroke-linecap: round !important;
        stroke-linejoin: round !important;
        fill: none !important;
        padding: 0 !important;
        margin: 0 !important;
        box-sizing: border-box !important;
        pointer-events: none !important;
        flex-shrink: 0 !important;
    }

    .dog-video-single-card .dog-video-mute svg path,
    .dog-video-single-card .dog-video-mute svg line {
        stroke: #ffffff !important;
        stroke-width: 2 !important;
        stroke-linecap: round !important;
        stroke-linejoin: round !important;
        fill: none !important;
    }

    @media (max-width: 749px) {
        .dog-video-single-card {
            border-radius: 12px !important;
        }

        .dog-video-single-card video {
            border-radius: 12px !important;
        }

        .dog-video-single-card .dog-video-play {
            width: 52px !important;
            height: 52px !important;
            min-width: 52px !important;
            min-height: 52px !important;
            max-width: 52px !important;
            max-height: 52px !important;
        }

        .dog-video-single-card .dog-video-play::after {
            border-top-width: 10px !important;
            border-bottom-width: 10px !important;
            border-left-width: 16px !important;
            margin-left: 4px !important;
        }

        /* Mobile Mute Button chuẩn arrVideo: 32px x 32px, luôn hiện */
        .dog-video-single-card .dog-video-mute {
            width: 32px !important;
            height: 32px !important;
            min-width: 32px !important;
            min-height: 32px !important;
            bottom: 12px !important;
            right: 12px !important;
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
        }

        .dog-video-single-card .dog-video-mute svg {
            width: 16px !important;
            height: 16px !important;
            min-width: 16px !important;
            min-height: 16px !important;
        }
    }
</style>

<script>
    (function () {
        "use strict";
        function initCard() {
            var card = document.getElementById("rascalRoverInstallCard") || document.querySelector(".dog-video-single-card");
            if (!card) return;

            // Ưu tiên dùng Video Engine toàn cục từ 02-global-body.html
            if (window.FlusbaseVideoEngine && typeof window.FlusbaseVideoEngine.initSingleCard === "function") {
                window.FlusbaseVideoEngine.initSingleCard(card);
                return;
            }

            // Fallback cơ bản khi mở xem trực tiếp file video4.html độc lập (không có 02-global-body.html)
            if (card.dataset.dogSingleInit) return;
            card.dataset.dogSingleInit = "1";

            var video = card.querySelector("video");
            var muteButton = card.querySelector(".dog-video-mute");
            if (!video) return;

            video.addEventListener("playing", function () { card.classList.add("is-playing"); });
            video.addEventListener("pause", function () { card.classList.remove("is-playing"); });

            card.addEventListener("click", function (e) {
                if (e.target.closest(".dog-video-mute")) return;
                if (video.paused) {
                    video.play().catch(function () { });
                } else {
                    video.pause();
                }
            });

            if (muteButton) {
                muteButton.addEventListener("click", function (e) {
                    e.stopPropagation();
                    video.muted = !video.muted;
                });
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initCard);
        } else {
            initCard();
        }
    })();
</script>
